name: Triage policy benchmark operation
description: Explicit paired-policy profile using common evidence and per-call scopes
inputs:
  mode:
    required: true
    description: activate, plan, run, audit, independent-audit (no solver replay)
  phase:
    required: false
    description: Frozen phase name
  artifact-id:
    required: false
    description: Immutable payload ID
  digest:
    required: false
    description: Immutable payload SHA256
  asset-id:
    required: false
    description: Prepared release bundle asset ID
  confirm:
    required: false
    description: Explicit launch confirmation
  job-started-ms:
    required: false
    description: Job clock before checkout/setup
outputs:
  large-phase:
    description: Frozen single-stage phase name
    value: ${{ steps.native.outputs.large-phase }}
  large-run:
    description: Approved broad ten-minute study
    value: ${{ steps.native.outputs.large-run }}
  fast-followup:
    description: Approved single-stage follow-up
    value: ${{ steps.native.outputs.fast-followup }}
  artifact-id:
    description: Activation artifact ID
    value: ${{ steps.native.outputs.artifact-id }}
  digest:
    description: Activation SHA256
    value: ${{ steps.native.outputs.digest }}
  matrix:
    description: Frozen phase chunk matrix
    value: ${{ steps.native.outputs.matrix }}
  has-work:
    description: Whether phase has admitted tasks
    value: ${{ steps.native.outputs.has-work }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24.13.0
    - run: npm ci --ignore-scripts --no-audit --no-fund
      shell: bash
    - run: npm ci --prefix tools/secondary-bench/artifact-action --ignore-scripts --no-audit --no-fund
      shell: bash
    - id: native
      uses: ./tools/secondary-bench/common/action
      with:
        protocol: triage
        mode: ${{ inputs.mode }}
        phase: ${{ inputs.phase }}
        artifact-id: ${{ inputs.artifact-id }}
        digest: ${{ inputs.digest }}
        asset-id: ${{ inputs.asset-id }}
        confirm: ${{ inputs.confirm }}
        job-started-ms: ${{ inputs.job-started-ms }}
