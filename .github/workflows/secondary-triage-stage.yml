name: Triage bounded paired stage
on:
  workflow_call:
    inputs:
      phase:
        type: string
        required: true
      artifact-id:
        type: string
        required: true
      digest:
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-work: ${{ steps.plan.outputs.has-work }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        uses: ./tools/secondary-bench/common/triage/action
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: plan
          phase: ${{ inputs.phase }}
          artifact-id: ${{ inputs.artifact-id }}
          digest: ${{ inputs.digest }}
  run:
    needs: plan
    if: needs.plan.outputs.has-work == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ (inputs.phase == 'CP_MEMORY_R9' || inputs.phase == 'CP_COMPACT_R11') && 4 || 16 }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - id: clock
        run: echo "started=$(node -p 'Date.now()')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: ./tools/secondary-bench/common/triage/action
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: run
          phase: ${{ inputs.phase }}
          artifact-id: ${{ matrix.artifactId }}
          digest: ${{ matrix.digest }}
          job-started-ms: ${{ steps.clock.outputs.started }}
