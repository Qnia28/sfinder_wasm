name: Fast budget contract and artifact preflight
on:
  workflow_dispatch:
  push:
    branches: [experiment/fast-budget-20261015]
    paths: [.github/workflows/fast-budget-preflight.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: fast-budget-20261015
  cancel-in-progress: false
env:
  # Completed solver evidence is reused; this revision repairs transport only.
  SOURCE_RUN_ID: '38755030086'
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-ids: ${{ steps.preflight.outputs.artifact-ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix tools/secondary-bench/artifact-action --ignore-scripts --no-audit --no-fund
      - name: Seed and transport contracts (no population calls)
        run: node --test tests/fast-bench-adapter.test.mjs tests/fast-bench-transport.test.mjs
      - name: Reuse completed contracts and immutable payloads
        uses: actions/download-artifact@v4
        with:
          name: fast-preflight-evidence
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: fast-preflight
      - name: Retry transport only with Actions runtime credentials
        id: preflight
        uses: ./tools/fast-bench/action
      - name: Preserve all starts, outcomes and upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-preflight-evidence
          path: fast-preflight/
          compression-level: 1
          retention-days: 30
          if-no-files-found: error
  round-trip:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download only the three exact payload IDs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.contracts.outputs.artifact-ids }}
          path: fast-round-trip
      - name: Verify all sealed member hashes
        run: node tools/fast-bench/remote-preflight.mjs verify fast-round-trip
