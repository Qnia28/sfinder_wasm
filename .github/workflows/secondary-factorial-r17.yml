name: RC regression R17 factorial 12VM cap
on:
  push:
    branches: [experiment/secondary-routing-20261005]
    paths: [.github/secondary-triage/R17_START.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: secondary-triage-probe-seed
  cancel-in-progress: false
jobs:
  plan:
    if: contains(github.event.head_commit.message, '[RUN_R17_12VM]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - id: plan
        run: node tools/secondary-bench/common/triage/factorial-action.mjs plan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-lock-RC_REGRESSION_R17_FACTORIAL_20261012
          path: activation/
          retention-days: 30
  run:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - id: clock
        run: echo "started=$(node -p 'Date.now()')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix tools/secondary-bench/artifact-action --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: triage-lock-RC_REGRESSION_R17_FACTORIAL_20261012
          path: activation/
      - uses: ./tools/secondary-bench/common/triage/factorial-native
        env:
          R17_CHUNK: ${{ matrix.index }}
          JOB_STARTED_MS: ${{ steps.clock.outputs.started }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-data-RC_REGRESSION_R17_FACTORIAL_20261012-worker-${{ matrix.index }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
  audit:
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: triage-*
          path: download/
      - run: python -B tools/secondary-bench/common/triage/factorial-audit.py
      - if: always()
        run: node --input-type=module -e "import {seal} from './tools/secondary-bench/common/evidence.mjs'; await seal('audit',{campaignId:'RC_REGRESSION_R17_FACTORIAL_20261012',name:'independent-audit'});"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-independent-RC_REGRESSION_R17_FACTORIAL_20261012-FINAL
          path: audit/
          retention-days: 30
